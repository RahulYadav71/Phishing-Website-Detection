<!DOCTYPE html>
<html>

<head>

    <title>Phishing Website Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Phishing Website Detection</h1>

    <form method="POST">

        <input
            type="text"
            name="url"
            placeholder="Enter Website URL"
            required>

        <br><br>

        <button type="submit">
            Check Website
        </button>

    </form>

    {% if result %}

        <div class="result">

            <h2>{{ result }}</h2>

            <h3>
                Confidence :
                {{ "%.2f"|format(confidence) }}%
            </h3>

        </div>

    {% endif %}

</div>

</body>
</html>
